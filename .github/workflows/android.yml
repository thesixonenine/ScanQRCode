name: Release Draft By Tag

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
  # push:
  #   branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
    - name: Build Release
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        find . -type f -name "*.gradle.kts" -exec sed -i '/aliyun/d' {} +
        find . -type f -name "*.gradle.kts" -exec sed -i '/tencent/d' {} +
        find . -name 'gradle-wrapper.properties' -exec sed -i 's/mirrors\.cloud\.tencent\.com\/gradle/services.gradle.org\/distributions/g' {} +
        mkdir -p ~/.android
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/release.keystore
        chmod +x ./gradlew
        ./gradlew assembleRelease
    - uses: actions/upload-artifact@v7
      with:
        name: ScanQRCode-Release-APK
        path: ./app/build/outputs/apk/release/*.apk
    - uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: ./app/build/outputs/apk/release/*.apk
        draft: true