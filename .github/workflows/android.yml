name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      # Fork PRs never receive secrets, so they build debug instead of signed release.
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
    - name: Remove Mirror
      run: |
        find . -type f -name "*.gradle.kts" -exec sed -i '/aliyun/d' {} +
        find . -type f -name "*.gradle.kts" -exec sed -i '/tencent/d' {} +
        find . -name 'gradle-wrapper.properties' -exec sed -i 's/mirrors\.cloud\.tencent\.com\/gradle/services.gradle.org\/distributions/g' {} +
    - name: Build Release
      if: env.IS_FORK_PR != 'true'
      env:
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/release.keystore
        ./gradlew assembleRelease
    - name: Build Debug
      if: env.IS_FORK_PR == 'true'
      run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v7
      with:
        name: ScanQRCode-APK
        path: app/build/outputs/apk/*/*.apk
        if-no-files-found: error
    - uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        files: app/build/outputs/apk/release/*.apk
        draft: true
        generate_release_notes: true
